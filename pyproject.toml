[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vocabulary-video-analytics"
version = "0.1.0"
description = "Query-guided detection, segmentation, tracking, and temporal analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "pillow>=10.0", "pandas>=2.1", "torch>=2.2", "torchvision>=0.17", "transformers>=4.43", "supervision>=0.22", "ultralytics>=8.2", "pyyaml>=6.0", "tqdm>=4.66"]

[project.optional-dependencies]
sam = ["sam2 @ git+https://github.com/facebookresearch/sam2.git"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ovva = "ovva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
